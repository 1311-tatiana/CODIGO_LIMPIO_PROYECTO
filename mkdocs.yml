site_name: Ferreteria Inventario API
theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]

nav:
  - Inicio: index.md
  - Primeros pasos: getting-started.md
  - Arquitectura: architecture.md
  - Referencia API: reference.md
  - Guia de usuario:
      - Comandos CLI: user-guide/commands.md
      - Persistencia: user-guide/persistence.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
