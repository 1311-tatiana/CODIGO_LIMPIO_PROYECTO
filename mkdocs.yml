site_name: Ferretería Inventario
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]

nav:
  - Inicio: index.md
  - Primeros pasos: getting-started.md
  - Guía de usuario:
    - Comandos CLI: user-guide/commands.md
    - Persistencia: user-guide/persistence.md
  - Arquitectura: architecture.md
  - Referencia API: reference.md

markdown_extensions:
 markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.highlight:
      use_pygments: true
      guess_lang: false
  - pymdownx.inlinehilite
